[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazelab"
version = "0.1.0"
description = "面向数据结构学习者的迷宫生成、求解与逐步可视化工具"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Calmthor" }]
keywords = ["maze", "data-structures", "algorithms", "visualization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mazelab = "mazelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
